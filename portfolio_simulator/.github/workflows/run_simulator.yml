name: Run Portfolio Simulator

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      MARKETSTACK_API_KEY: ${{ secrets.MARKETSTACK_API_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd portfolio_simulator
          pip install -r requirements.txt

      - name: Run simulator
        run: |
          cd portfolio_simulator
          python app.py
